<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitScreen - Fire TV Fitness Dashboard</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff9900; /* Amazon Orange */
            font-size: 3.5rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 1.5rem;
            color: #cccccc;
            margin-bottom: 40px;
        }
        .grid-container {
            display: flex;
            gap: 30px;
        }
        .card {
            background-color: #333333;
            padding: 30px;
            border-radius: 12px;
            width: 250px;
            text-align: center;
            border: 4px solid transparent;
            transition: all 0.3s ease;
        }
        /* TV Remote Focus State Simulation */
        .card:hover {
            border-color: #ff9900;
            transform: scale(1.05);
            background-color: #444444;
            cursor: pointer;
        }
        .card h2 {
            font-size: 2.5rem;
            margin: 10px 0;
        }
        .card p {
            font-size: 1.2rem;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <h1>FitScreen AI</h1>
    <p class="subtitle">Select your workout for today (Demo UI for Fire OS)</p>

    <div class="grid-container">
        <div class="card">
            <h2>🧘</h2>
            <h2>Yoga</h2>
            <p>15 Min Morning Flow</p>
        </div>
        <div class="card">
            <h2>🏃</h2>
            <h2>Cardio</h2>
            <p>30 Min Fat Burn</p>
        </div>
        <div class="card">
            <h2>💪</h2>
            <h2>Strength</h2>
            <p>Full Body Workout</p>
        </div>
    </div>

</body>
</html>
